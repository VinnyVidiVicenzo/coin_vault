name: coin_vault
description: "Coin & currency collection inventory management app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.9.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Data models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Local database (offline cache)
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.1

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Charts
  fl_chart: ^0.70.2

  # Files & documents
  file_picker: ^10.1.9

  # Sharing & export
  share_plus: ^11.0.0
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.1

  # Networking & connectivity
  connectivity_plus: ^6.1.4
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  collection: ^1.19.1
  logging: ^1.3.0
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  drift_dev: ^2.26.1

flutter:
  uses-material-design: true
